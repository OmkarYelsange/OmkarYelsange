name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real GitHub contribution data
        env:
          GH_PROFILE_USER: OmkarYelsange
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap
        run: python scripts/generate_streak_svg.py OmkarYelsange contrib-heatmap.svg

      - name: Render animated contribution stats
        run: python scripts/render_stats_svg.py

      - name: Commit updated generated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
